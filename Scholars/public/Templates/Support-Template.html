<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Ticket • Scholars</title>
</head>
<body style="margin: 0; padding: 0; background-color: #191414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ffffff; line-height: 1.5;">
  <center>
  <table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #191414; min-height: 100vh;">
  <tr>
  <td align="center" style="padding: 20px 15px;">
  <!-- Main Container - Full mobile width -->
  <table width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 100%; width: 100%; background: #121212; border-radius: 8px; border: 1px solid #282828;">

  <!-- Header -->
  <tr>
  <td style="background: #7B68EE; padding: 25px 20px; border-radius: 8px 8px 0 0;">
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
  <tr>
  <td align="center">
<img src="https://i.ibb.co/6cMDcV0Q/Scholars-Template-Logo.png" alt="Spotify" width="40" height="40" style="display: block; margin: 0 auto 12px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; padding: 10px;">
<!-- <img src="../Images/Logo.svg" alt="Scholars" width="40" height="40" style="display: block; margin: 0 auto 12px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; padding: 10px;"> -->
<h1 style="font-size: 20px; font-weight: 700; color: #191414; margin: 0 0 6px 0;">Support Ticket</h1>
<p style="font-size: 13px; color: rgba(25, 20, 20, 0.8); margin: 0;">New customer request</p>
  </td>
  </tr>
  </table>
  </td>
  </tr>

  <!-- Content -->
  <tr>
  <td style="padding: 25px 20px;">
  
  <!-- Status Badge -->
  <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto 25px;">
  <tr>
  <td style="background: #1E1A2F; border: 1px solid #7B68EE; border-radius: 12px; padding: 6px 12px;">
<span style="color: #CFC9FF; font-size: 11px; font-weight: 700; text-transform: uppercase;">
  {{isFirstMessage}}
</span>
  </td>
  </tr>
  </table>

  <!-- Ticket Information -->
  <table width="100%" border="0" cellpadding="0" cellspacing="0" style="margin-bottom: 25px;">
  <tr>
  <td>
<h2 style="font-size: 15px; font-weight: 700; color: #ffffff; margin: 0 0 16px 0; padding-bottom: 10px; border-bottom: 1px solid #282828;">Ticket Information</h2>

<!-- Info Rows -->
<table width="100%" border="0" cellpadding="0" cellspacing="0">
  <!-- Ticket ID -->
  <tr>
  <td style="padding: 10px 0; border-bottom: 1px solid #282828;">
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
  <tr>
  <td style="color: #b3b3b3; font-size: 13px; font-weight: 500; padding-bottom: 4px;">Ticket ID</td>
  </tr>
  <tr>
  <td style="color: #7B68EE; font-size: 14px; font-weight: 600; word-break: break-word;">{{ticketId}}</td>
  </tr>
  </table>
  </td>
  </tr>

  <!-- User Email -->
  <tr>
  <td style="padding: 10px 0; border-bottom: 1px solid #282828;">
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
  <tr>
  <td style="color: #b3b3b3; font-size: 13px; font-weight: 500; padding-bottom: 4px;">Email</td>
  </tr>
  <tr>
  <td style="color: #ffffff; font-size: 14px; font-weight: 500; word-break: break-word;">{{userEmail}}</td>
  </tr>
  </table>
  </td>
  </tr>
</table>
  </td>
  </tr>
  </table>

  <!-- Message Content -->
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="margin-bottom: 25px;">
<tr>
  <td>
<h2 style="font-size: 15px; font-weight: 700; color: #ffffff; margin: 0 0 16px 0; padding-bottom: 10px; border-bottom: 1px solid #282828;">Message</h2>

  <div style="background: #181818; border: 1px solid #282828; border-radius: 6px; padding: 16px;">
  <div style="color: #ffffff; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; max-width: 100%; overflow-wrap: break-word; font-weight: 400;">
{{message}}
  </div>
  </div>
  </td>
  </tr>
  </table>

  <!-- Action Button -->
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
  <tr>
  <td align="center">
<a href="http://localhost:3000/Contact-Us" style="display: inline-block; background: #7B68EE; color: #191414; padding: 12px 24px; border-radius: 500px; text-decoration: none; font-weight: 700; font-size: 14px; border: none;">
  View in Support Dashboard
</a>
  </td>
  </tr>
  </table>

  </td>
  </tr>

  <!-- Footer -->
  <tr>
  <td style="background: #000000; padding: 20px; border-radius: 0 0 8px 8px; border-top: 1px solid #282828;">
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
  <tr>
  <td align="center">
<p style="color: #b3b3b3; font-size: 11px; margin: 0 0 10px 0; line-height: 1.4;">
  This email was automatically generated by Scholars Support System.
</p>

<table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto 10px;">
  <tr>
  <td style="padding: 0 8px;">
  <a href="http://localhost:3000/Contact-Us/About" style="color: #7B68EE; text-decoration: none; font-size: 11px; font-weight: 500;">Privacy Policy</a>
  </td>
  <td style="color: #b3b3b3; padding: 0 4px;">•</td>
  <td style="padding: 0 8px;">
  <a href="http://localhost:3000/Contact-Us/Contact-Us" style="color: #7B68EE; text-decoration: none; font-size: 11px; font-weight: 500;">Unsubscribe</a>
  </td>
  </tr>
</table>

<p style="color: #b3b3b3; font-size: 10px; margin: 0;">
  &copy; {{currentYear}} Scholars AB
</p>
  </td>
  </tr>
  </table>
  </td>
  </tr>

  </table>
  </td>
  </tr>
  </table>
  </center>
</body>
</html>
