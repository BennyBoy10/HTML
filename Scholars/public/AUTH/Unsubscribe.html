<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Images/Scholars-Favicon.png">

  <title>Unsubscribed | Global Scholars</title>

  <style>
:root {
  --scholars-green:#6A5ACD;
  --scholars-black:#0b0b0b;
  --scholars-dark:#121212;
  --scholars-gray:#b3b3b3;
  --scholars-white:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Circular', Arial, sans-serif;
}

body{
  background:var(--scholars-black);
  color:var(--scholars-white);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

/* ===== LOADER ===== */
.loader-box{
  text-align:center;
  animation:fadeIn 0.8s ease forwards;
}

.loader{
  width:65px;
  height:65px;
  border:6px solid rgba(255,255,255,0.1);
  border-top:6px solid var(--scholars-green);
  border-radius:50%;
  margin:0 auto 20px;
  animation:spin 1.2s linear infinite;
}

.loading-text{
  font-size:18px;
  color:var(--scholars-gray);
  letter-spacing:1px;
}

/* ===== RESULT ===== */
.result-box{
  display:none;
  text-align:center;
  animation:fadeInUp 0.7s ease forwards;
}

.checkmark{
  font-size:70px;
  color:var(--scholars-green);
  margin-bottom:20px;
}

.result-title{
  font-size:30px;
  font-weight:900;
  margin-bottom:10px;
}

.result-desc{
  color:var(--scholars-gray);
  font-size:16px;
  max-width:320px;
  margin:0 auto;
  line-height:1.5;
}

.back-btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 35px;
  border-radius:50px;
  background:var(--scholars-green);
  color:var(--scholars-black);
  font-weight:800;
  font-size:15px;
  text-decoration:none;
  transition:transform 0.3s ease;
}

.back-btn:hover{
  transform:scale(1.07);
}

/* ===== ANIMATIONS ===== */
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes fadeInUp{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}

  </style>
</head>
<body>

  <!-- LOADING ANIMATION -->
  <div class="loader-box" id="loaderBox">
    <div class="loader"></div>
    <p class="loading-text">Processing your request...</p>
  </div>

  <!-- RESULT -->
  <div class="result-box" id="resultBox">
    <div class="checkmark">✔</div>
    <h1 class="result-title">You're Unsubscribed</h1>
    <p class="result-desc">
You will no longer receive promotional emails from us.
Your request has been successfully processed.
    </p>

    <a href="../" class="back-btn">Return Home</a>
  </div>

  <script>
    // Delay 2 seconds then show success message
    setTimeout(() => {
      document.getElementById("loaderBox").style.display = "none";
      document.getElementById("resultBox").style.display = "block";
    }, 2000);
  </script>

</body>
</html>
