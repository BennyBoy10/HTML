<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Payment</title>

  <style>
body {
  margin: 0;
  padding: 0;
  background: #0b0b0f;
  font-family: "Segoe UI", sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #1a1125;
  max-width: 80%;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(130, 0, 255, 0.2);
  border: 1px solid rgba(180, 80, 255, 0.2);
  text-align: center;
}
h2 {
  margin-bottom: 20px;
  color: #c28eff;
  font-weight: 600;
}

input:-webkit-autofill,
input:-webkit-autofill:hover, 
input:-webkit-autofill:focus, 
input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 1000px #120a19 inset !important;
  box-shadow: 0 0 0 1000px #120a19 inset !important;
  color: #EEE !important;
}
input:-webkit-autofill {
  -webkit-text-fill-color: #EEE !important;
}

input {
  width: 90%;
  padding: 12px;
  border: 1px solid #6a3dad;
  outline: none;
  background: #120a19;
  color: #EEE;
  font-size: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 12px;
  background: #7d3df3;
  border: none;
  font-size: 16px;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}
button:hover {
  background: #5c24c7;
}
button:disabled {
  color: #E0E0E0;
  background-color: #45286b;
  cursor: not-allowed;
}
.message {
  margin-top: 15px;
  font-size: 14px;
  color: #cfaaff;
}

  </style>

</head>
<body>

  <div class="container">
<h2>Update Payment</h2>
<input type="email" id="emailInput" placeholder="User Email" required>
<button id="submit-button">Submit</button>
<p class="message" id="statusMsg"></p>
  </div>

<script>

var submitButton = document.getElementById("submit-button");
var messageDiv = document.getElementById("statusMsg");

async function updatePaymentStatus() {
  const email = document.getElementById("emailInput").value;
  const paymentStatus = "Pending";
  const paymentReference = "REF-" + Date.now();
//  const adminNote = "Updated manually from panel";

if (!email) {
  document.getElementById("statusMsg").textContent = "Please enter a valid Email!";
  return;
}

  messageDiv.textContent = "Updating Payment Status...";
  submitButton.disabled = true;

try {
  const response = await fetch("/api/payment", {
  method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
  email,
  paymentStatus,
  paymentReference
})
});

  const result = await response.json();

if (response.ok) {
  messageDiv.textContent =
  "✅ Payment updated Successfully️!";
  submitButton.disabled = false;
} else {
  messageDiv.textContent =
  "❌ Error: " + (result.error || "Something went wrong");
  submitButton.disabled = false;
}
} catch (error) {
  messageDiv.textContent =
  "❌ Network error";
  submitButton.disabled = false;
}
}

submitButton.addEventListener("click", function() {
  updatePaymentStatus();
});

</script>

</body>
</html>
